# Builds https://github.com/Poltavtcev/bambuddy and pushes ghcr.io/poltavtcev/bambuddy
# (Home Assistant add-on pulls that image — does not modify the bambuddy repo.)
name: Publish BamBuddy fork image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch on Poltavtcev/bambuddy
        required: false
        default: main

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Poltavtcev/bambuddy
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Ensure .git/HEAD for Dockerfile
        run: |
          test -f .git/HEAD || {
            mkdir -p .git
            echo "ref: refs/heads/${{ inputs.ref }}" >> .git/HEAD
          }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker-safe tag from branch name
        id: tag
        run: |
          # Docker tags cannot contain '/' (e.g. feature/foo → feature-foo)
          safe=$(echo "${{ inputs.ref }}" | tr '/:' '-')
          echo "value=${safe}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/poltavtcev/bambuddy:latest
            ghcr.io/poltavtcev/bambuddy:${{ steps.tag.outputs.value }}
