# Builds https://github.com/Poltavtcev/bambuddy and pushes to ghcr.io/poltavtcev/bambuddy
# so the Home Assistant add-on can pull instead of compiling on the host.
name: Publish BamBuddy image (Poltavtcev fork)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: BamBuddy git ref (branch or tag)
        required: false
        default: main
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BamBuddy fork
        uses: actions/checkout@v4
        with:
          repository: Poltavtcev/bambuddy
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/poltavtcev/bambuddy:latest
            ghcr.io/poltavtcev/bambuddy:${{ github.sha }}
