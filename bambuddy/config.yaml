# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bambuddy (rolling)
version: "1.3.5"
slug: bambuddy
description: >-
  BamBuddy from fork ghcr.io/poltavtcev/bambuddy (storage locations Phase 2). Run "Publish BamBuddy
  fork image" when the fork changes, then Rebuild. For upstream: edit FROM in bambuddy/Dockerfile.
  Host networking for virtual printer LAN ports.
url: "https://github.com/Poltavtcev/hassio-koinsight"
arch:
  - aarch64
  - amd64
init: false
host_network: true
map:
  # Exposes HA /media inside the add-on at the same path (e.g. NAS mounts).
  # Required for Link External Folder paths like /media/NAS_1/...
  - media:rw
hassio_role: homeassistant
privileged:
  - NET_RAW
homeassistant_api: true
options:
  debug: false
schema:
  debug: bool
ports:
  8480/tcp: 8480
webui: http://[HOST]:[PORT:8480]
watchdog: http://[HOST]:[PORT:8480]/health
