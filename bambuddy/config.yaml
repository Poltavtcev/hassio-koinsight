# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bambuddy (rolling)
version: "1.0.1"
slug: bambuddy
description: >-
  BamBuddy print archive for Bambu Lab printers. Built from
  ghcr.io/maziggy/bambuddy:latest — use Rebuild in Supervisor to refresh
  to the newest published image.
url: "https://github.com/schwarztrinker/hassio-koinsight"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
hassio_role: homeassistant
privileged:
  - NET_RAW
homeassistant_api: true
options:
  debug: false
schema:
  debug: bool
ports:
  8000/tcp: 8000
webui: http://[HOST]:[PORT:8000]
watchdog: http://[HOST]:[PORT:8000]/health
