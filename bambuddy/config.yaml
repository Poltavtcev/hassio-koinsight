# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bambuddy (rolling)
version: "1.3.0"
slug: bambuddy
description: >-
  BamBuddy for Bambu Lab printers from the Poltavtcev fork
  (ghcr.io/poltavtcev/bambuddy). Fast Rebuild on HA. Host networking for virtual
  printer LAN ports. Rebuild to pull a newer image after the fork is updated.
url: "https://github.com/Poltavtcev/hassio-koinsight"
arch:
  - aarch64
  - amd64
init: false
host_network: true
map:
  # Exposes HA /media inside the add-on at the same path (e.g. NAS mounts).
  # Required for Link External Folder paths like /media/NAS_1/...
  - media:rw
hassio_role: homeassistant
privileged:
  - NET_RAW
homeassistant_api: true
options:
  debug: false
schema:
  debug: bool
ports:
  8480/tcp: 8480
webui: http://[HOST]:[PORT:8480]
watchdog: http://[HOST]:[PORT:8480]/health
