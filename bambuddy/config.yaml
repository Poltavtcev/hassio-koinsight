# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bambuddy (rolling)
version: "1.1.3"
slug: bambuddy
description: >-
  BamBuddy print archive for Bambu Lab printers. Alpine runtime reinstalls
  Python deps (plate detection / OpenCV). Host networking exposes virtual printer
  LAN ports on the HA machine. Rebuild in Supervisor to refresh upstream.
url: "https://github.com/Poltavtcev/hassio-koinsight"
arch:
  - aarch64
  - amd64
init: false
host_network: true
hassio_role: homeassistant
privileged:
  - NET_RAW
homeassistant_api: true
options:
  debug: false
schema:
  debug: bool
ports:
  8000/tcp: 8000
webui: http://[HOST]:[PORT:8000]
watchdog: http://[HOST]:[PORT:8000]/health
