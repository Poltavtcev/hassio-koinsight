# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bambuddy (rolling)
version: "1.0.4"
slug: bambuddy
description: >-
  BamBuddy print archive for Bambu Lab printers. Runs the upstream Debian-based
  image (no Alpine pip rebuild). Use host networking so the virtual printer LAN
  ports are reachable; Rebuild in Supervisor to refresh upstream.
url: "https://github.com/schwarztrinker/hassio-koinsight"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
host_network: true
hassio_role: homeassistant
privileged:
  - NET_RAW
homeassistant_api: true
options:
  debug: false
schema:
  debug: bool
webui: http://[HOST]:8000
watchdog: http://[HOST]:8000/health
