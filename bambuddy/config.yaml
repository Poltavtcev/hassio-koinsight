# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Bambuddy (rolling)
version: "1.2.1"
slug: bambuddy
description: >-
  BamBuddy print archive for Bambu Lab printers. Uses the pre-built
  ghcr.io/maziggy/bambuddy image (fast updates). Host networking exposes virtual
  printer LAN ports on the HA machine. Rebuild in Supervisor to pull a newer upstream tag.
url: "https://github.com/Poltavtcev/hassio-koinsight"
arch:
  - aarch64
  - amd64
init: false
host_network: true
map:
  # Exposes HA /media inside the add-on at the same path (e.g. NAS mounts).
  # Required for Link External Folder paths like /media/NAS_1/...
  - media:rw
hassio_role: homeassistant
privileged:
  - NET_RAW
homeassistant_api: true
options:
  debug: false
schema:
  debug: bool
ports:
  8480/tcp: 8480
webui: http://[HOST]:[PORT:8480]
watchdog: http://[HOST]:[PORT:8480]/health
