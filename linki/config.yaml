name: "Linki"
version: "0.1.0"
slug: linki
description: "Open-source AI SDR for B2B outreach. LinkedIn sequences, cold email, and lead enrichment."
url: "https://github.com/moaljumaa/linki"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Web interface"
map:
  - share:rw
options:
  nextauth_url: "http://homeassistant.local:3000"
  nextauth_secret: "generate_a_random_secret_here"
  auth_password: "change_me"
schema:
  nextauth_url: str
  nextauth_secret: password
  auth_password: password
